# Optional: App Runner config-as-code (when connecting a GitHub repo).
# Console deploy with Dockerfile also works — use these values there.
version: 1.0
runtime: docker
build:
  commands:
    build:
      - echo "Using Dockerfile build"
run:
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"
  # Secrets / remaining env vars should be set in App Runner console
  # (DATABASE_URL, SECRET_KEY, AWS_*, S3_*, CORS_ORIGINS, PUBLIC_BASE_URL, OTPs).
